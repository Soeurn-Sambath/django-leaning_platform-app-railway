<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&display=swap"
      rel="stylesheet"
    />
    <style>
        body{
            font-family: 'Kantumruy Pro', sans-serif !important;
            background-image: linear-gradient(
                rgba(0, 0, 0, 0.9),
                rgba(0, 0, 0, 0.5),
                rgba(0, 0, 0, 0.9)

            )
            ,url('https://www.khmertimeskh.com/wp-content/uploads/2026/04/Angkor-Equinox-4.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">
{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white/60 backdrop-blur-sm border border-gray-200 shadow-xs rounded-xl p-8 w-full max-w-sm">
        <div class="mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-center">Login</h1>
        </div>
        
        {% if form.errors %}
            <div class="mb-5 text-sm text-red-600">
                Invalid username or password.
            </div>
        {% endif %}
        
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required 
                    class="w-full px-3.5 py-2.5 text-sm border border-gray-500 rounded-lg focus:border-blue-600 focus:ring-3 focus:ring-blue-600/10 outline-none transition"
                    placeholder="Enter username">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" required
                    class="w-full px-3.5 py-2.5 text-sm border border-gray-500 rounded-lg focus:border-blue-600 focus:ring-3 focus:ring-blue-600/10 outline-none transition"
                >
            </div>
            
            {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button type="submit" class="w-full bg-blue-600 text-white text-sm font-medium py-2.5 rounded-lg hover:bg-blue-700 transition mt-2 cursor-pointer">
                Login
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account?
            <a href="{% url 'register' %}" class="text-blue-600 font-medium hover:underline">Register</a>
        </p>
    </div>
</div>
{% endblock content %}
</body>
</html>
